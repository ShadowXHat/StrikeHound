name: StrikeHound Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Nmap & Nuclei)
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap
          # Install Nuclei binary
          curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
            | grep "browser_download_url.*linux_amd64.zip" \
            | cut -d : -f 2,3 \
            | tr -d \" \
            | wget -qi -
          unzip nuclei*linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -update-templates

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Configuration
        run: |
          if [ ! -f config.yaml ]; then cp config.example.yaml config.yaml; fi

      - name: Run StrikeHound Scan
        run: |
          python strikehound.py -t http://testphp.vulnweb.com -m quick

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strikehound-scan-results
          path: output/
          retention-days: 14
