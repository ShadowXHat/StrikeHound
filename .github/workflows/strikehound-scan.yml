name: StrikeHound Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install Nmap and Nuclei
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          sudo cp $(go env GOPATH)/bin/nuclei /usr/local/bin/

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install fpdf2 pyyaml requests

      - name: Setup Headless Config
        run: |
          cat << 'EOF' > config.yaml
          tools:
            nmap_path: /usr/bin/nmap
            nuclei_path: /usr/local/bin/nuclei
            zap_path: ""
            zap_api_url: "http://localhost:8080"
            zap_api_key: ""
            slack_webhook: ""
          scan_profiles:
            quick: '-F -T4'
            standard: '-sV -sC -T4'
            full: '-A -T3 -p-'
          severity_map:
            nuclei:
              critical: Critical
              high: High
              medium: Medium
              low: Low
            zap:
              3: Critical
              2: High
              1: Medium
              0: Low
          EOF
          mkdir -p output

      - name: Run StrikeHound Pipeline
        run: |
          python3 strikehound.py -t http://testphp.vulnweb.com -m quick

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strikehound-scan-results
          path: output/
          retention-days: 14
