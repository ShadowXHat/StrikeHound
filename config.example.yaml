tools:
  nmap_path: /usr/bin/nmap
  nuclei_path: /usr/bin/nuclei
  zap_path: /path/to/zap.sh
  zap_api_url: http://localhost:8080
  zap_api_key: your_zap_api_key
  slack_webhook: YOUR_WEBHOOK_URL

# ZAP-specific options.
# ajax_spider: also run ZAP's headless-browser crawler (helps find SPAs/auth'd pages).
# auth.method: "none" (default), "form", or "header".
#   form:   HTML login form. login_url is required; username/password are read
#           from config OR env vars STRIKEHOUND_ZAP_USERNAME / STRIKEHOUND_ZAP_PASSWORD
#           (env vars win - recommended for CI). login_request_data is optional and
#           defaults to "<username_field>={%username%}&<password_field>={%password%}".
#   header: static auth header, e.g. Authorization: Bearer <token>. The token can
#           also come from the STRIKEHOUND_ZAP_TOKEN env var.
zap:
  # Instead of driving ZAP through the REST API, write an Automation Framework
  # plan per web target (output/zap-plans/) and print the `-cmd -autorun` command
  # to run it. Best for complex auth; the pipeline then skips the REST scan.
  automation: false
  ajax_spider: false
  auth:
    method: none
    login_url: ""
    username_field: "username"
    password_field: "password"
    username: ""
    password: ""
    login_request_data: ""
    header_name: "Authorization"
    header_value: ""

# Forwarded to Nuclei to keep scans production-friendly and low-noise.
# rate_limit: max requests/sec (Nuclei defaults to 150 - too aggressive for
#             most production targets/WAFs). 30-50 is a safe starting point.
# tags/severity: optional template filters, e.g. "cve,exposure" / "high,critical".
nuclei:
  rate_limit: 50
  concurrency: 25
  bulk_size: 10
  timeout: 10
  retries: 1
  tags: ""
  severity: ""

scan_profiles:
  quick: '-F -T4'
  standard: '-sV -sC -T4'
  full: '-A -T3 -p-'

severity_map:
  nuclei:
    critical: Critical
    high: High
    medium: Medium
    low: Low
  zap:
    3: Critical
    2: High
    1: Medium
    0: Low
  ssh_audit:
    critical: Critical
    high: High
    medium: Medium
    low: Low
    info: Info
