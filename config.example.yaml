tools:
  nmap_path: /usr/bin/nmap
  nuclei_path: /usr/bin/nuclei
  zap_path: /path/to/zap.sh
  zap_api_url: http://localhost:8080
  zap_api_key: your_zap_api_key
  slack_webhook: YOUR_WEBHOOK_URL

scan_profiles:
  quick: '-F -T4'
  standard: '-sV -sC -T4'
  full: '-A -T3 -p-'

severity_map:
  nuclei:
    critical: Critical
    high: High
    medium: Medium
    low: Low
  zap:
    3: Critical
    2: High
    1: Medium
    0: Low
  ssh_audit:
    low: Low
